; --- Cat4U: PHP per l'ambiente Docker ---

; Rende le variabili d'ambiente del container disponibili in $_ENV
; (l'app legge $_ENV['DB_HOST'] ecc.). Senza la "E" iniziale non funziona.
variables_order = "EGPCS"

; Upload dei cataloghi PDF (il default 2M è troppo basso)
upload_max_filesize = 100M
post_max_size = 110M

memory_limit = 256M
max_execution_time = 120